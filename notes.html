<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Notes | RajExams</title>

    <meta name="description"
        content="राजस्थान और भारत के Government Exams की तैयारी के लिए महत्वपूर्ण Study Notes।">

    <link rel="icon" href="favicon.ico">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


<!-- ==========================================================
     Header
========================================================== -->

<div id="header"></div>


<!-- ==========================================================
     Latest Updates / Breaking News
========================================================== -->

<div id="breaking-news"></div>


<!-- ==========================================================
     Notes Header
========================================================== -->

<section class="notes-top">

    <div class="container">

        <div class="notes-top-row">

            <div class="notes-heading">

                <h1>📚 Study Notes</h1>

                <p>
                    Rajasthan & India Government Exams के लिए महत्वपूर्ण Notes
                </p>

            </div>


            <div class="notes-search">

                <input
                    type="search"
                    id="notesSearch"
                    placeholder="🔍 Notes खोजें..."
                    autocomplete="off">

            </div>

        </div>

    </div>

</section>



<!-- ==========================================================
     Notes Reader
========================================================== -->

<section class="notes-reader">

    <div class="container">

        <div class="notes-layout">


            <!-- ==================================================
                 LEFT SIDE : NOTES LIST
            =================================================== -->

            <aside class="notes-sidebar">

                <div class="notes-sidebar-header">

                    <span>📖 Notes</span>

                    <span id="notesCount"></span>

                </div>


                <!-- Dynamic Notes List -->

                <div id="notesList">

                    <!-- notes.js will load notes here -->

                </div>


            </aside>



            <!-- ==================================================
                 RIGHT SIDE : NOTE CONTENT
            =================================================== -->

            <main class="notes-content">

                <div
                    id="noteContent"
                    class="note-content-area">

                    <div class="notes-welcome">

                        <div class="notes-welcome-icon">
                            📚
                        </div>

                        <h2>Study Notes</h2>

                        <p>
                            बाईं ओर से कोई Note चुनें और उसका पूरा
                            अध्ययन सामग्री यहाँ पढ़ें।
                        </p>

                    </div>

                </div>

            </main>


        </div>

    </div>

</section>



<!-- ==========================================================
     Footer
========================================================== -->

<div id="footer"></div>



<!-- ==========================================================
     JavaScript
========================================================== -->

<script src="js/loader.js"></script>

<script src="js/api.js"></script>

<script src="js/app.js"></script>

<script src="js/notes.js"></script>


</body>

</html>
