<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Notes | RajExams</title>

<meta name="description"
content="Free Study Notes for Rajasthan and India Government Exams.">

<link rel="icon" href="favicon.ico">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<!-- Notes Page CSS -->
<link rel="stylesheet" href="css/notes.css">

</head>

<body>

<!-- Header -->
<div id="header"></div>

<!-- Breaking News -->
<div id="breaking-news"></div>


<!-- Page Banner -->

<section class="page-banner">

    <div class="container">

        <h1>Study Notes</h1>

        <p>
            Government Exam Preparation के लिए महत्वपूर्ण Study Notes
        </p>

    </div>

</section>


<!-- Notes Reader -->

<section class="notes-reader-section">

    <div class="container">

        <div class="notes-reader">


            <!-- =========================
                 LEFT SIDEBAR
            ========================== -->

            <aside class="notes-sidebar">

                <div class="notes-sidebar-header">

                    <h2>Study Notes</h2>

                    <span id="notesCount">
                        0 Notes
                    </span>

                </div>


                <!-- Search -->

                <div class="notes-search">

                    <input
                        type="search"
                        id="notesSearch"
                        placeholder="🔍 नोट्स खोजें..."
                        autocomplete="off">

                </div>


                <!-- Notes List -->

                <div class="notes-list-wrapper">

                    <ul id="notesList">

                        <!-- notes.js से data आएगा -->

                    </ul>

                </div>

            </aside>



            <!-- =========================
                 RIGHT CONTENT
            ========================== -->

            <main class="notes-content">

                <div
                    id="notesContent"
                    class="notes-content-inner">

                    <!-- Default Message -->

                    <div class="notes-welcome">

                        <div class="notes-welcome-icon">
                            📚
                        </div>

                        <h2>
                            Study Notes
                        </h2>

                        <p>
                            बाईं तरफ से कोई भी Note चुनें
                            और उसका पूरा content यहाँ पढ़ें।
                        </p>

                    </div>

                </div>

            </main>


        </div>

    </div>

</section>


<!-- Footer -->

<div id="footer"></div>


<!-- JS -->

<script src="js/loader.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

<!-- Notes JS -->
<script src="js/notes.js"></script>

</body>

</html>
