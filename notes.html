<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Notes | RajExams</title>

    <meta name="description"
        content="Rajasthan और India Government Exams के लिए महत्वपूर्ण Study Notes.">

    <link rel="icon" href="favicon.ico">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<div id="header"></div>


<!-- =========================================================
     BREAKING NEWS
========================================================= -->




<!-- =========================================================
     NOTES PAGE
========================================================= -->

<main class="notes-page">


    <!-- =====================================================
         NOTES TOP BAR
    ====================================================== -->

    <section class="notes-topbar">

        <div class="notes-container">

            <div class="notes-heading">

                <div class="notes-heading-icon">
                    📚
                </div>

                <div>

                    <h1>Study Notes</h1>

                    <p>
                        Rajasthan & India Government Exams के लिए महत्वपूर्ण Notes
                    </p>

                </div>

            </div>


            <!-- Search -->

            <div class="notes-search">

                <span>⌕</span>

                <input
                    type="search"
                    id="notesSearch"
                    placeholder="Notes खोजें...">

            </div>

        </div>

    </section>



    <!-- =====================================================
         NOTES WORKSPACE
    ====================================================== -->

    <section class="notes-workspace">

        <div class="notes-container notes-layout">


            <!-- =================================================
                 LEFT SIDEBAR
            ================================================== -->

            <aside class="notes-sidebar">


                <div class="sidebar-header">

                    <div>

                        <small>STUDY MATERIAL</small>

                        <h2>Notes</h2>

                    </div>

                    <button
                        type="button"
                        id="sidebarToggle"
                        aria-label="Toggle Notes Menu">

                        ☰

                    </button>

                </div>


                <!-- Dynamic Notes Navigation -->

                <nav
                    id="notesNavigation"
                    class="notes-navigation">

                    <!--
                        notes.js will generate:

                        Rajasthan
                          └── Art & Culture
                                ├── प्रमुख राजस्थानी कृतियाँ
                                ├── राजस्थान की प्रमुख चित्रकला
                                └── ...

                        India
                          └── History
                          └── Geography

                        Science
                          └── Physics
                          └── Chemistry
                          └── Biology
                    -->

                </nav>


            </aside>



            <!-- =================================================
                 RIGHT CONTENT AREA
            ================================================== -->

            <section class="notes-content">


                <!-- Content Header -->

                <div class="content-header">

                    <div class="content-breadcrumb"
                         id="notesBreadcrumb">

                        Study Notes

                    </div>

                    <button
                        type="button"
                        class="content-fullscreen"
                        id="notesFullscreen"
                        title="Fullscreen">

                        ⛶

                    </button>

                </div>


                <!-- Content Viewer -->

                <div
                    id="notesViewer"
                    class="notes-viewer">


                    <!-- Initial State -->

                    <div
                        id="notesWelcome"
                        class="notes-welcome">

                        <div class="welcome-icon">
                            📖
                        </div>

                        <h2>
                            अपना Note चुनें
                        </h2>

                        <p>
                            बाईं ओर से Category → Subject → Note चुनें।
                            चुना हुआ Note यहाँ दिखाई देगा।
                        </p>

                    </div>


                    <!-- Actual HTML note content -->

                    <iframe
                        id="notesFrame"
                        class="notes-frame"
                        title="Study Note Content"
                        loading="lazy"
                        hidden>
                    </iframe>


                </div>


            </section>


        </div>

    </section>


</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<div id="footer"></div>



<!-- =========================================================
     SCRIPTS
========================================================= -->

<script src="js/loader.js"></script>

<script src="js/api.js"></script>

<script src="js/app.js"></script>

<script src="js/notes.js"></script>


</body>

</html>
