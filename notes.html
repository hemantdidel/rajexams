<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Notes | RajExams</title>

    <meta name="description"
        content="राजस्थान और भारत के Government Exams की तैयारी के लिए महत्वपूर्ण Study Notes।">

    <link rel="icon" href="favicon.ico">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>


<!-- ==========================================================
     Header
========================================================== -->

<div id="header"></div>


<!-- ==========================================================
     Latest Updates
========================================================== -->

<div id="breaking-news"></div>


<!-- ==========================================================
     NOTES PAGE
========================================================== -->

<main class="notes-page">

    <div class="container">


        <!-- ==================================================
             Notes Heading
        =================================================== -->

        <section class="notes-intro">

            <div class="notes-intro-text">

                <span class="notes-label">
                    📚 STUDY MATERIAL
                </span>

                <h1>
                    Study Notes
                </h1>

                <p>
                    Rajasthan & India Government Exams के लिए
                    महत्वपूर्ण और परीक्षा उपयोगी Notes
                </p>

            </div>


            <!-- Search -->

            <div class="notes-search-box">

                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    id="notesSearch"
                    placeholder="Notes खोजें..."
                    autocomplete="off">

            </div>

        </section>



        <!-- ==================================================
             Main Categories
        =================================================== -->

        <nav class="notes-categories" id="notesCategories">

            <button
                class="notes-category active"
                data-category="all">

                सभी Notes

            </button>

            <button
                class="notes-category"
                data-category="Rajasthan">

                🏜️ Rajasthan

            </button>

            <button
                class="notes-category"
                data-category="India">

                🇮🇳 India

            </button>

            <button
                class="notes-category"
                data-category="Science">

                🔬 Science

            </button>

        </nav>



        <!-- ==================================================
             Subjects
        =================================================== -->

        <div
            class="notes-subjects"
            id="notesSubjects">

            <!-- Dynamic subjects -->

        </div>



        <!-- ==================================================
             Notes Library
        =================================================== -->

        <section
            class="notes-library"
            id="notesLibrary">


            <!-- Library Header -->

            <div class="library-header">

                <div>

                    <span class="library-kicker">
                        NOTES LIBRARY
                    </span>

                    <h2 id="notesSectionTitle">
                        सभी Study Notes
                    </h2>

                </div>

                <span
                    id="notesCount"
                    class="notes-count">

                    0 Notes

                </span>

            </div>



            <!-- Notes List -->

            <div
                id="notesList"
                class="notes-items">

                <!-- notes.js will load notes here -->

            </div>


        </section>



        <!-- ==================================================
             Note Reader
        =================================================== -->

        <section
            id="noteReader"
            class="note-reader"
            hidden>


            <!-- Reader Top -->

            <div class="reader-top">

                <button
                    id="backToNotes"
                    class="back-notes">

                    ← सभी Notes

                </button>

                <span
                    id="readerSubject"
                    class="reader-subject">

                </span>

            </div>


            <!-- Reader Content -->

            <article
                id="noteContent"
                class="note-content">

                <!-- Selected HTML note will load here -->

            </article>


        </section>


    </div>

</main>



<!-- ==========================================================
     Footer
========================================================== -->

<div id="footer"></div>



<!-- ==========================================================
     JavaScript
========================================================== -->

<script src="js/loader.js"></script>

<script src="js/api.js"></script>

<script src="js/app.js"></script>

<script src="js/notes.js"></script>


</body>

</html>
